# Development-only access for the playground's Alice login.
# Dashboard proxy access is operator access: dashboard mutations execute with
# Cleaner controller permissions and are not limited to cleaner-demo resources.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-cleaner-demo-reader
rules:
  - apiGroups: [apps.projectsveltos.io]
    resources: [cleaners, reports]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-cleaner-demo-alice
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headlamp-cleaner-demo-reader
subjects:
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: alice
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: headlamp-cleaner-demo-operator
  namespace: k8s-cleaner
rules:
  - apiGroups: ['']
    resources: [services/proxy]
    resourceNames: ['http:k8s-cleaner-web:9080']
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: headlamp-cleaner-demo-alice
  namespace: k8s-cleaner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: headlamp-cleaner-demo-operator
subjects:
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: alice
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: headlamp-cleaner-demo-reader
  namespace: cleaner-demo
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [pods, configmaps]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: headlamp-cleaner-demo-alice
  namespace: cleaner-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: headlamp-cleaner-demo-reader
subjects:
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: alice
