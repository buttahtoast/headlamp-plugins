# Apply after demo.yaml. These jobs are deliberately retained for inspection.
# No TTL controller cleanup is configured, and both Cleaner policies use Scan.
apiVersion: batch/v1
kind: Job
metadata:
  name: demo-nightly-report
  namespace: cleaner-demo
  labels:
    app.kubernetes.io/part-of: headlamp-cleaner-demo
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: headlamp-cleaner-demo
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: task
          image: docker.io/library/busybox:1.37.0
          command: [sh, -c, 'echo "Demo: nightly report generated successfully"; sleep 2']
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 50m, memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
