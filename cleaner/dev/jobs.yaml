---
apiVersion: apps.projectsveltos.io/v1alpha1
kind: Cleaner
metadata:
  name: headlamp-demo-completed-jobs
  labels:
    app.kubernetes.io/part-of: headlamp-cleaner-demo
spec:
  action: Scan
  schedule: '*/5 * * * *'
  resourcePolicySet:
    resourceSelectors:
      - group: batch
        version: v1
        kind: Job
        namespace: cleaner-demo
        labelFilters:
          - key: app.kubernetes.io/part-of
            operation: Equal
            value: headlamp-cleaner-demo
        evaluate: |
          function evaluate(obj)
            if obj.status ~= nil and obj.status.conditions ~= nil then
              for _, condition in ipairs(obj.status.conditions) do
                if condition.type == "Complete" and condition.status == "True" then
                  return { matching = true, message = "Job completed successfully; candidate for cleanup (Scan only)" }
                end
              end
            end
            return { matching = false }
          end
  notifications:
    - name: report
      type: CleanerReport
---
apiVersion: apps.projectsveltos.io/v1alpha1
kind: Cleaner
metadata:
  name: headlamp-demo-failed-jobs
  labels:
    app.kubernetes.io/part-of: headlamp-cleaner-demo
spec:
  action: Scan
  schedule: '*/5 * * * *'
  resourcePolicySet:
    resourceSelectors:
      - group: batch
        version: v1
        kind: Job
        namespace: cleaner-demo
        labelFilters:
          - key: app.kubernetes.io/part-of
            operation: Equal
            value: headlamp-cleaner-demo
        evaluate: |
          function evaluate(obj)
            if obj.status ~= nil and obj.status.conditions ~= nil then
              for _, condition in ipairs(obj.status.conditions) do
                if condition.type == "Failed" and condition.status == "True" then
                  return { matching = true, message = condition.message or condition.reason or "Job failed" }
                end
              end
            end
            return { matching = false }
          end
  notifications:
    - name: report
      type: CleanerReport
